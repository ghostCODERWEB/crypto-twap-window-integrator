[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-twap-window-integrator"
version = "0.1.0"
description = "Integrate piecewise constant observations over exact lookback windows and report coverage and price bounds."
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
crypto-twap-window-integrator = "cryptolab:main"

[tool.setuptools.packages.find]
include = ["cryptolab*"]

[tool.setuptools.package-data]
cryptolab = ["web/*"]
